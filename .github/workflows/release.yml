name: Release

# Two ways to cut a release — both end in test → per-OS build → ONE GitHub Release
# (a tag with a prerelease part, e.g. v0.1.0-rc.1, publishes as a pre-release):
#
#   1. `make release` (BUMP=minor…), or Actions → Release → "Run workflow". The `bump` job
#      makes the release commit (version + CHANGELOG.md entry) and its tag; the `push` job
#      checks it and pushes both to main; the rest of the run builds and publishes it.
#      Release commits are only made here, on a fresh checkout of main.
#   2. Tag push: `git push origin v0.1.2-rc.1` → skips `bump` / `push` and just builds +
#      publishes the pushed tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump to apply
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# Read-only by default: only `push` (commit + tag) and `publish` (the release) can write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Dispatch only: make the release commit (package.json + CHANGELOG.md) and its tag, and hand
  # them to `push` as a git bundle. This job runs git-cliff (a locked devDependency), so it
  # references no secrets and has a read-only token; `push` decides what reaches main.
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # git-cliff from the lockfile; no install scripts (and no Electron download) needed here
      - run: npm ci --ignore-scripts
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release commit + tag
        id: bump
        run: |
          TAG="$(scripts/release-commit.sh "${{ inputs.bump }}")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git bundle create release.bundle "refs/tags/$TAG" ^origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release.bundle
          retention-days: 1

  # Dispatch only: push bump's commit and tag after checking them: one commit straight on main's
  # tip, changing only the `version` fields and CHANGELOG.md, tagged v<that version>. A separate
  # job (fresh runner) so nothing bump ran can reach the tokens. Safe to re-run: a main or tag
  # push that already happened is skipped.
  push:
    needs: [bump]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set — needed to push the release commit to main (bypasses the branch ruleset). See the Push step." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # the bundle's base (main's tip at bump time) must be here
          # Don't persist GITHUB_TOKEN: checkout's http.extraheader would override the
          # PAT in the push URL below, so the main push would go out as the bot → GH013.
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
      - name: Check the release commit
        id: check
        env:
          TAG: ${{ needs.bump.outputs.tag }}
        run: scripts/check-release-commit.sh "$TAG" release.bundle >> "$GITHUB_OUTPUT"
      - name: Push
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_ACTIONS_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump.outputs.tag }}
          PUSH_MAIN: ${{ steps.check.outputs.push_main }}
          PUSH_TAG: ${{ steps.check.outputs.push_tag }}
        run: |
          REPO="${{ github.repository }}"
          # main's ruleset requires status checks a fresh release commit never ran, and
          # github-actions[bot] can't be a bypass actor. RELEASE_TOKEN is a classic PAT
          # (scope `repo`) owned by an admin in the ruleset's bypass list. It goes in the
          # USERNAME slot: `x-access-token:` would resolve the pusher as an App actor and
          # the admin bypass wouldn't apply.
          if [ "$PUSH_MAIN" = true ]; then
            git push "https://${RELEASE_TOKEN}@github.com/${REPO}.git" "refs/tags/$TAG^{commit}:refs/heads/main"
          fi
          # Tag stays on GITHUB_TOKEN on purpose: a GITHUB_TOKEN-pushed tag doesn't fire
          # this workflow's `push: tags` path, so the release isn't built twice.
          if [ "$PUSH_TAG" = true ]; then
            git push "https://x-access-token:${GH_ACTIONS_TOKEN}@github.com/${REPO}.git" "refs/tags/$TAG"
          fi

  # Gate: don't ship from red code. Runs for both paths; on dispatch it waits for the
  # bump and checks out the newly-created tag.
  test:
    needs: [bump, push]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

  # Build installers per OS (no publish here — a single publish job avoids the
  # electron-builder race where parallel jobs each create a duplicate draft).
  build:
    needs: [test, bump]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build renderer/main/preload
        run: npm run build
      # node-pty is rebuilt by electron-builder for the packaged Electron; mac is
      # ad-hoc signed (build/after-pack.cjs). --publish never = build only.
      - name: Package installers
        run: npx electron-builder --publish never
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: ignore
          retention-days: 5

  # Collect every OS's artifacts and publish a single release for the tag — the newly
  # bumped tag (dispatch) or the pushed tag (tag push).
  publish:
    needs: [build, bump]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release notes are the tag's CHANGELOG.md entry, read from the file (no git-cliff
      # here). No entry: a release this workflow made had only docs/tests/CI PRs, so it says
      # so; a hand-pushed tag (an rc) gets GitHub's generated notes. Checkout first: it
      # cleans the dir.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Release notes
        id: notes
        env:
          TAG: ${{ needs.bump.outputs.tag || github.ref_name }}
          BUMPED: ${{ needs.bump.outputs.tag != '' }}
        run: |
          make -s release-notes TAG="$TAG" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            if [ "$BUMPED" != true ]; then
              echo "No CHANGELOG.md entry for $TAG; using GitHub's generated notes."
              exit 0
            fi
            echo "No user-facing changes in this release." > RELEASE_NOTES.md
          fi
          echo "path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
          cat RELEASE_NOTES.md
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.tag || github.ref_name }}
          name: ${{ needs.bump.outputs.tag || github.ref_name }}
          prerelease: ${{ contains(needs.bump.outputs.tag || github.ref_name, '-') }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: dist/**
          fail_on_unmatched_files: false
      # minmux.dev/changelog reads CHANGELOG.md from main when the site builds, so ask Vercel
      # for a fresh build. Skipped while the LANDING_DEPLOY_HOOK secret isn't set.
      - name: Rebuild the landing page
        # the release is already out; a Vercel hiccup mustn't turn the run red (and invite a re-run)
        continue-on-error: true
        env:
          LANDING_DEPLOY_HOOK: ${{ secrets.LANDING_DEPLOY_HOOK }}
        run: |
          if [ -n "$LANDING_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$LANDING_DEPLOY_HOOK" > /dev/null && echo "Landing page rebuild requested."
          else
            echo "LANDING_DEPLOY_HOOK not set; skipping."
          fi
